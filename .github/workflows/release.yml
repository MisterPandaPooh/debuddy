name: Release

# Tag a commit `vX.Y.Z` (matching package.json) to build one VSIX per platform, attach them to a
# GitHub release, and publish to the Marketplace / Open VSX when the tokens are configured.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:dap && npm run test:lang
      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - run: npx @vscode/vsce package --target ${{ matrix.target }} --out explain-mode-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: explain-mode-${{ matrix.target }}
          path: explain-mode-${{ matrix.target }}.vsix

  release:
    name: GitHub release + publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: vsix
          merge-multiple: true
      - name: GitHub release with the VSIX files
        uses: softprops/action-gh-release@v2
        with:
          files: vsix/*.vsix
          generate_release_notes: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to the VS Code Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: for f in vsix/*.vsix; do npx @vscode/vsce publish --packagePath "$f"; done
      - name: Publish to Open VSX (Cursor, VSCodium)
        if: ${{ secrets.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: for f in vsix/*.vsix; do npx ovsx publish "$f" -p "$OVSX_PAT"; done
