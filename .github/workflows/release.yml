name: Release

# Tag a commit `vX.Y.Z` (matching package.json) to build one VSIX per platform, attach them to a
# GitHub release, and publish to the Marketplace / Open VSX when the tokens are configured.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-14
            target: darwin-x64
            npm_flags: --cpu x64 --os darwin
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci ${{ matrix.npm_flags }}
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:dap && npm run test:lang
      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - run: npx @vscode/vsce package --target ${{ matrix.target }} --out debuddy-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: debuddy-${{ matrix.target }}
          path: debuddy-${{ matrix.target }}.vsix

  release:
    name: GitHub release + publish
    needs: package
    runs-on: ubuntu-latest
    # The `marketplace` environment carries the Entra ID variables; OIDC needs id-token: write.
    environment: marketplace
    permissions:
      contents: write
      id-token: write
    # `secrets`/`vars` cannot be read in step `if`s; copy them into env and test that instead.
    # No PAT anywhere: the Marketplace is reached through Entra ID (OIDC), Open VSX through its own token.
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: vsix
          merge-multiple: true
      - name: GitHub release with the VSIX files
        uses: softprops/action-gh-release@v2
        with:
          files: vsix/*.vsix
          generate_release_notes: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Preferred, no secret at all: GitHub's OIDC token is exchanged for a Microsoft Entra ID token
      # (federated credential on the app registration), then vsce publishes with it.
      - name: Sign in to Microsoft Entra ID (OIDC, no secret)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to the VS Code Marketplace (Entra ID)
        if: env.AZURE_CLIENT_ID != ''
        run: for f in vsix/*.vsix; do npx @vscode/vsce publish --azure-credential --packagePath "$f"; done

      # Open VSX is the extension registry Cursor, VSCodium, Windsurf and Gitpod use.
      - name: Publish to Open VSX (Cursor marketplace)
        if: env.OVSX_PAT != ''
        run: for f in vsix/*.vsix; do npx ovsx publish "$f" -p "$OVSX_PAT"; done
