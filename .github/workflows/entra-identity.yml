name: Entra identity (one-off)

# Prints the identifier the VS Code Marketplace expects when adding the publishing identity as a
# publisher member (the `az rest …/profiles/me` call from the VS Code docs). Run it once from the
# Actions tab; it needs the `marketplace` environment variables AZURE_CLIENT_ID / AZURE_TENANT_ID.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Identity as seen by the Marketplace
        run: |
          echo "## Marketplace identity" >> "$GITHUB_STEP_SUMMARY"
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query "{id:id, displayName:displayName, emailAddress:emailAddress}" -o json | tee identity.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat identity.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Paste the \`id\` above into Marketplace → publisher → Members → Add (role Contributor)." >> "$GITHUB_STEP_SUMMARY"
